server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router dziala w trybie history, wiec kazda sciezka nieodpowiadajaca
    # plikowi musi zwrocic index.html — inaczej odswiezenie podstrony da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
