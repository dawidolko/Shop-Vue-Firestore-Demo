services:
  app:
    image: node:20-alpine
    container_name: shop-vue-firestore-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../../:/app
      # Anonimowy wolumen chroni node_modules z obrazu przed nadpisaniem
      # przez katalog hosta (inny system plikow, inne binaria).
      - /app/node_modules
