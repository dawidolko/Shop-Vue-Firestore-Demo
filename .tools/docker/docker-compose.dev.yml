name: shopvue-firestore-project

services:
  app:
    image: node:20-alpine
    container_name: shop-vue-firestore-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../../:/app
      # Anonymous volume keeps the image's node_modules from being overwritten
      # by the host directory (different file system, different binaries).
      - /app/node_modules
